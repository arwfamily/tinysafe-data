name: Tinysafe Hybrid Sync Automation

on:
  schedule:
    - cron: '0 12 * * *' # 매일 뉴욕 시간 아침 8시 (UTC 12:00) 무인 자동 실행
  workflow_dispatch: # 개발자가 필요할 때 수동으로 버튼 눌러 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 3.10 환경 구성
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl

    - name: 4대 소스 동시 크로스체크 실행
      run: python cron.py

    - name: 변경 내용 자동 커밋 및 레포지토리 푸시
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add recalls_unified.json
        if ! git diff --cached --quiet; then
          git commit -m "행동 보정: 4대 유아 키워드 전수 동기화 및 라이프사이클 승급 반영"
          git push
        else
          echo "새로운 리콜이나 변경 사항이 없습니다. 정밀도 100% 동기화 상태 유지 중."
        fi
