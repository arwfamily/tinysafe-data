name: TinySafe Link Audit (manual)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Knock on every URL in the store
        run: python audit_links.py .
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: link_audit_report.txt
