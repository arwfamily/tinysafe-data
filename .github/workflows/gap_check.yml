# .github/workflows/gap_check.yml
#
# FDA gap check — compares recalls_unified.json against FDA's live
# Enforcement Report via openFDA. READ-ONLY: never commits or pushes anything.
#
# Runs every Thursday (FDA posts the Enforcement Report on Wednesdays) over a
# rolling 60-day window. If openFDA holds a child recall TinySafe does not, it
# comments on the "Data pipeline needs attention" issue. It can also be run by
# hand from Actions -> "FDA gap check" -> Run workflow with a custom window.
# The CSV and a ready-to-review fda_enforcement_new.jsonl download as artifacts.

name: FDA gap check

on:
  schedule:
    - cron: '17 15 * * 4'     # Thursdays 11:17 America/New_York
  workflow_dispatch:
    inputs:
      since:
        description: "window start, YYYYMMDD (blank = last 60 days)"
        required: false
        default: ""
      to:
        description: "window end, YYYYMMDD (blank = today)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  gap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - name: Run gap check
        env:
          SINCE: ${{ github.event.inputs.since }}
          TO: ${{ github.event.inputs.to }}
        run: |
          if [ -z "$TO" ]; then unset TO; fi
          if [ -z "$SINCE" ]; then unset SINCE; fi
          python fda_gap_check.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fda-gap-report
          path: |
            fda_gap_report.csv
            fda_enforcement_new.jsonl

      - name: Report missing recalls
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline_notify.py . --context "weekly FDA gap check" || true
